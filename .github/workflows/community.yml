name: Merge community hole maps
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/community-merge.mjs
      - name: Commit changes
        run: |
          git config user.name "kunikuni-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/community
          git diff --cached --quiet || (git commit -m "Community hole maps update" && git push)
